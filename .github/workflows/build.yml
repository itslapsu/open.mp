name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "stable"
      - "stable_master"
      - "dev"
    paths:
      - "**.hpp"
      - "**.cpp"
      - "**.h"
      - "**.c"
      - "**CMakeLists.txt"
      - "**.cmake"
      - ".github/workflows/build.yml"
      - "docker/**"

jobs:
  build-linux-debian11:
    name: Linux build (Debian 11, x86)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Declare build output variables
        id: vars
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "build_version=$(git describe --always --tags "refs/remotes/origin/${HEAD_REF}")" >> $GITHUB_OUTPUT
          echo "build_config=RelWithDebInfo" >> $GITHUB_OUTPUT
          echo "build_debian_version=11" >> $GITHUB_OUTPUT
          echo "build_shared=false" >> $GITHUB_OUTPUT
          echo "build_server=1" >> $GITHUB_OUTPUT
          echo "build_tools=0" >> $GITHUB_OUTPUT
          echo "build_target_arch=x86" >> $GITHUB_OUTPUT

      - name: Set ownership
        run: |
          # this is to fix GIT not liking owner of the checkout dir
          chown -R $(id -u):$(id -g) $PWD

      - name: Try to restore conan cache
        id: conan-cache-restore
        uses: actions/cache/restore@v4
        env:
          cache-name: cache-conan-modules
        with:
          path: docker/conan2/p
          key: conan-debian11-x86-static-${{ hashFiles('CMakeLists.txt', 'lib/CMakeLists.txt', 'SDK/CMakeLists.txt', 'SDK/lib/cmake-conan/conan.cmake', 'SDK/lib/cmake-conan/conan-omp.cmake') }}

      - name: Build
        run: |
          cd docker
          CONFIG=${{ steps.vars.outputs.build_config }} DEBIAN_VERSION=${{ steps.vars.outputs.build_debian_version }} BUILD_SHARED=${{ steps.vars.outputs.build_shared }} BUILD_SERVER=${{ steps.vars.outputs.build_server }} BUILD_TOOLS=${{ steps.vars.outputs.build_tools }} TARGET_BUILD_ARCH=${{ steps.vars.outputs.build_target_arch }} ./build.sh

      - name: Try to save conan cache
        if: steps.conan-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        env:
          cache-name: cache-conan-modules
        with:
          path: docker/conan2/p
          key: ${{ steps.conan-cache-restore.outputs.cache-primary-key }}

      - name: Create a build archive
        id: build
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          version=${{ steps.vars.outputs.build_version }}
          artifact_name="open.mp-debian11-x86-${version}"
          echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
          cd docker/build/Output/*
          sudo tar -cJvf "${artifact_name}.tar.xz" "Server"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: docker/build/Output/${{ steps.vars.outputs.build_config }}/${{ steps.build.outputs.artifact_name }}.tar.xz
          if-no-files-found: error
